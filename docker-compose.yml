services:
  postgres:
    image: postgres:16-alpine
    container_name: lifestyleng_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lifestyleng
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: lifestyleng_core
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
